name: Actualizar escudos

# Busca en TheSportsDB el escudo de cada club y guarda las URLs en src/data/crests.json.
# Correr a mano desde GitHub: pestaña Actions → "Actualizar escudos" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      all:
        description: "Volver a buscar todos (no solo los que faltan)"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 3 * *" # una vez por mes, para sumar clubes nuevos

permissions:
  contents: write

jobs:
  crests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run crests -- ${{ inputs.all && '--all' || '' }}
        timeout-minutes: 110
        continue-on-error: true
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/crests.json
          git diff --cached --quiet || (git commit -m "Actualizar escudos desde TheSportsDB" && git push)
