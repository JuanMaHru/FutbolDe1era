name: Descargar imágenes

# Baja las fotos de jugadores (Wikimedia Commons) y los escudos (TheSportsDB) al propio sitio,
# para no depender de que esos servidores dejen mostrarlas desde afuera.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Actualizar escudos"]
    types: [completed]

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/download_images.mjs
        timeout-minutes: 80
        continue-on-error: true
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img src/data/images-local.json
          git diff --cached --quiet || (git commit -m "Descargar fotos y escudos al sitio" && git pull --rebase origin main && git push)
